name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
  serves-configuration:
    name: Serves configuration from a git backend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Starting proves nothing. The failure worth catching is a client asking for a file that
      # does not exist: the server answers 200 with the shared application.yml and no error, and
      # the client starts under-configured. That is exactly how the gateway came up with no
      # routes and no JWKS location. Both halves are asserted -- a known name carries its own
      # properties, an unknown one does not.
      - name: Serve a throwaway backend and assert what comes back
        run: |
          mkdir -p /tmp/config-backend && cd /tmp/config-backend
          printf 'shared:\n  marker: from-application-yml\n' > application.yml
          printf 'gateway:\n  marker: from-api-gateway-yml\n' > api-gateway.yml
          git init -q -b main .
          git add -A
          git -c user.email=ci@example.invalid -c user.name=CI commit -qm "configuration"
          cd "$GITHUB_WORKSPACE"

          ./gradlew bootRun --args="--spring.cloud.config.server.git.uri=file:///tmp/config-backend" \
            > /tmp/server.log 2>&1 &

          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:8888/actuator/health > /dev/null 2>&1 && break
            if [ "$attempt" = "60" ]; then
              echo "Config server never answered:"; cat /tmp/server.log; exit 1
            fi
            sleep 2
          done
          echo "Config server is up"

          known=$(curl -fsS http://localhost:8888/api-gateway/default)
          echo "$known" | grep -q "from-api-gateway-yml" \
            || { echo "api-gateway.yml was not served:"; echo "$known"; cat /tmp/server.log; exit 1; }
          echo "$known" | grep -q "from-application-yml" \
            || { echo "the shared application.yml was not merged in:"; echo "$known"; exit 1; }
          echo "A known name carries its own properties"

          unknown=$(curl -fsS http://localhost:8888/does-not-exist/default)
          if echo "$unknown" | grep -q "from-api-gateway-yml"; then
            echo "An unknown name received another service's configuration"; exit 1
          fi
          echo "$unknown" | grep -q "from-application-yml" \
            || { echo "expected the shared application.yml:"; echo "$unknown"; exit 1; }
          echo "An unknown name gets the shared file and no error, which is why clients must name themselves"

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log || true
